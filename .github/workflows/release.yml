# Push a tag such as v1.0.1 and GitHub builds the release by itself.
# Or run it by hand (Actions -> Release -> Run workflow) with a version such as
# v1.0.1: the tag is then created on the selected branch when the Release is
# published.  Either way the Release gets:
#   - tidmun-studio-patch.zip  (used by the in-app update button)
#   - Tidmunz Studio.exe       (desktop launcher for new machines)
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish, e.g. v1.0.41"
        required: true

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Write version from tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw "Tag must look like v1.0.41: $env:RELEASE_TAG" }
          $version = $env:RELEASE_TAG.TrimStart("v")
          New-Item -ItemType Directory -Force snapgen_data/meta | Out-Null
          "{`n  `"version`": `"$version`"`n}" | Set-Content -Encoding utf8NoBOM snapgen_data/meta/snapgen_version.json

      - name: Build patch and launcher
        run: |
          python -m pip install --disable-pip-version-check pyinstaller
          python -B tools/build_update_patch.py
          python -B tools/build_launcher.py

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          Copy-Item "tools/release/Tidmunz Studio.exe" "tools/release/Tidmunz-Studio.exe"
          $assets = @("tools/release/tidmun-studio-patch.zip", "tools/release/Tidmunz-Studio.exe")
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --target "${{ github.sha }}" --title "ติดมันส์ สตูดิโอ $tag" --notes "อัปเดตและแก้ไขความเสถียร" --latest
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
